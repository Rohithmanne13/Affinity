[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "personalized-content-ranking"
version = "1.0.0"
description = "End-to-end personalized content recommendation and ranking platform using Apache Spark, XGBoost, PyTorch, MLflow, and FastAPI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Rohit"},
]
keywords = [
    "recommendation-system",
    "ranking",
    "machine-learning",
    "content-personalization",
    "spark",
    "xgboost",
    "pytorch",
    "mlflow",
    "fastapi",
]

[project.urls]
Repository = "https://github.com/rohit/personalized-content-ranking"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["recommender"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]
